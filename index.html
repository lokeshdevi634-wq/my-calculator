<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Professional Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #121212; margin: 0; }
        .calculator { background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #display { width: 100%; height: 50px; background: #2d2d2d; color: #fff; font-size: 24px; text-align: right; padding: 10px; box-sizing: border-box; border: none; border-radius: 6px; margin-bottom: 15px; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 15px; font-size: 18px; border: none; border-radius: 6px; cursor: pointer; background: #333; color: white; }
        button:hover { background: #444; }
        button.operator { background: #ff9500; }
        button.clear { background: #ff3b30; }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" disabled>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendValue('/')">/</button>
            <button class="operator" onclick="appendValue('*')">*</button>
            <button class="operator" onclick="appendValue('-')">-</button>
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('+')">+</button>
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="calculate()">=</button>
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('0')">0</button>
        </div>
    </div>
    <script>
        function appendValue(val) { document.getElementById('display').value += val; }
        function clearDisplay() { document.getElementById('display').value = ''; }
        function calculate() {
            try { document.getElementById('display').value = eval(document.getElementById('display').value); }
            catch (e) { alert('Invalid Input'); }
        }
    </script>
</body>
</html>
